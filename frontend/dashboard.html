<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Dashboard de Safras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <preconnect href="https://fonts.googleapis.com"></preconnect>
    <preconnect href="https://fonts.gstatic.com" crossorigin></preconnect>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 font-sans flex h-screen overflow-hidden antialiased">

    <div id="sidebar-container" class="shrink-0"></div>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-4">
                <h1 class="text-base font-semibold text-slate-800 tracking-tight">Dashboard de Monitoramento Safra Ativa</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <label for="cmb-safra" class="text-[11px] font-mono font-medium text-slate-500 uppercase tracking-wider">Safra Ativa:</label>
                <select id="cmb-safra" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:ring-1 focus:ring-emerald-700 focus:border-emerald-700">
                    <option value="">Carregando safras...</option>
                </select>
            </div>
        </header>

        <div class="p-8 space-y-6 max-w-7xl w-full mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <div class="bg-white p-6 rounded-xl border border-slate-200/80 shadow-sm flex flex-col justify-between items-center h-[340px]">
                    <div class="w-full flex justify-between items-center border-b border-slate-100 pb-3 mb-2">
                        <span class="text-xs font-semibold text-slate-700 flex items-center gap-2">
                            <i class="bi bi-pie-chart text-emerald-700 text-sm"></i> Progresso de Atividades
                        </span>
                        <i class="bi bi-three-dots-vertical text-slate-400 cursor-pointer"></i>
                    </div>
                    
                    <div class="relative flex items-center justify-center w-40 h-40">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="text-slate-100" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="svg-progresso" class="text-emerald-700 transition-all duration-500" stroke-dasharray="0, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="absolute text-center">
                            <span id="txt-porcentagem" class="text-3xl font-bold text-slate-800 tracking-tight">0%</span>
                            <p class="text-[11px] font-medium text-emerald-700 mt-0.5">Concluído</p>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-50 border border-slate-100 rounded-lg py-2 px-4 text-center">
                        <p class="text-xs text-slate-500 font-medium">
                            <span class="text-slate-800 font-bold" id="lbl-atividades-executadas">0 de 0</span> atividades executadas
                        </p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-slate-200/80 shadow-sm flex flex-col h-[340px]">
                    <div class="w-full flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                        <span class="text-xs font-semibold text-slate-700 flex items-center gap-2">
                            <i class="bi bi-calendar-check text-emerald-700 text-sm"></i> Próximas Atividades
                        </span>
                        <i class="bi bi-three-dots-vertical text-slate-400 cursor-pointer"></i>
                    </div>
                    <div id="container-proximas-atividades" class="flex-1 overflow-y-auto space-y-2.5 pr-1 text-xs">
                        <p class="text-slate-400 text-center py-8 font-mono text-[11px]">Sincronizando tarefas...</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-slate-200/80 shadow-sm flex flex-col h-[340px]">
                    <div class="w-full flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                        <span class="text-xs font-semibold text-slate-700 flex items-center gap-2">
                            <i class="bi bi-exclamation-triangle text-red-600 text-sm"></i> Painel de Alertas Ativos
                        </span>
                        <i class="bi bi-three-dots-vertical text-slate-400 cursor-pointer"></i>
                    </div>
                    <div id="container-alertas-ativos" class="flex-1 overflow-y-auto space-y-2.5 text-xs pr-1">
                        <p class="text-slate-400 text-center py-8 font-mono text-[11px]">Varrendo barramentos de risco...</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
