<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AgroGestor - Recursos Humanos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/components.js"></script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8 border-b border-slate-200 pb-5">
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Equipes e Operadores</h1>
                <p class="text-xs text-slate-500 mt-0.5">Gestão de acessos, técnicos agrícolas e credenciais associadas à fazenda.</p>
            </div>
            <button onclick="abrirModalCadastro()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2.5 rounded-lg shadow-sm transition-all flex items-center space-x-2 cursor-pointer">
                <i class="bi bi-person-plus-fill"></i> <span>Adicionar Integrante</span>
            </button>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200/80 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50/70 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500 font-mono">
                        <th class="px-6 py-3.5">Nome Completo</th>
                        <th class="px-6 py-3.5">E-mail de Acesso</th>
                        <th class="px-6 py-3.5">Função (Escopo)</th>
                        <th class="px-6 py-3.5">Data de Admissão</th>
                    </tr>
                </thead>
                <tbody id="tbody-funcionarios" class="text-xs divide-y divide-slate-100 text-slate-700">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="modal-funcionario" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden animate-fade-in">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-800">Cadastrar Novo Técnico</h3>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="form-funcionario" class="p-6 space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 font-mono mb-1.5">Nome Completo</label>
                    <input type="text" id="txt-nome" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:outline-emerald-600">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 font-mono mb-1.5">E-mail Corporativo</label>
                    <input type="email" id="txt-email" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:outline-emerald-600">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 font-mono mb-1.5">Senha de Acesso Inicial</label>
                    <input type="password" id="txt-senha" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:outline-emerald-600">
                </div>
                <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100 mt-5">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-lg transition-all cursor-pointer">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-lg shadow-sm transition-all cursor-pointer">Salvar Integrante</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/funcionario.js"></script>
</body>
</html>
